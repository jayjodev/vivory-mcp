[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vivory-mcp-verification"
version = "0.15.0"
description = "Discontinued. The hosted API this MCP server called was shut down on 2026-08-09; this final release only tells your agent so. Please remove it from your MCP client configuration."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Vivory", email = "contact@vivory.app" },
]
keywords = ["mcp", "model-context-protocol", "discontinued"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # 2.x removed the Server.list_tools/call_tool decorators used here, and
    # releases before 1.25 fail to import against current pydantic 2.x.
    "mcp>=1.25,<2",
]

[project.urls]
Homepage = "https://vivory.app"
Repository = "https://github.com/jayjodev/vivory-mcp"

[project.scripts]
vivory-mcp-verification = "vivory_mcp_verification.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vivory_mcp_verification"]
