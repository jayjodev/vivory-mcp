[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vivory-mcp-verification"
version = "0.11.0"
description = "MCP for verifiable AI: DOI/ORCID/OpenAlex, OpenCitations, PubPeer, Funder, salami screen, archive, repro hash, media provenance (C2PA/EXIF/pHash/video/PDF/AI-gen sig/CID/RFC 3161), peer-review, forecast, SEC EDGAR, GLEIF, Wikidata, Wikipedia cite-health, trials, World Bank, USPTO, OSM, DefiLlama, USGS, MOLIT, RDAP, EVM audit, npm/PyPI supply chain, Retraction Watch, Korean law/KYB, OFAC sanctions, openFDA/CPSC recall, DOAJ, PR diff, cross-source reconcile. 101 tools / 37 cats."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Vivory", email = "contact@vivory.app" },
]
keywords = [
    "mcp",
    "verification",
    "citation",
    "doi",
    "orcid",
    "wayback",
    "archive",
    "c2pa",
    "provenance",
    "watermark",
    "exif",
    "perceptual-hash",
    "ffprobe",
    "cid",
    "ipfs",
    "pdf-metadata",
    "ai-generator-detection",
    "reproducibility",
    "peer-review",
    "forecast",
    "sec",
    "edgar",
    "gleif",
    "lei",
    "openalex",
    "wikidata",
    "clinicaltrials",
    "worldbank",
    "uspto",
    "openstreetmap",
    "defillama",
    "usgs",
    "molit",
    "korea",
    "real-estate",
    "rtms",
    "whois",
    "rdap",
    "dns",
    "blockchain",
    "evm",
    "npm",
    "pypi",
    "supply-chain",
    "typosquat",
    "retraction",
    "workflow",
    "policy",
    "law",
    "sanctions",
    "ofac",
    "recall",
    "openfda",
    "cpsc",
    "doaj",
    "predatory-journal",
    "press-release",
    "churnalism",
    "anthropic",
    "claude",
    "verifiable-ai",
    "source-trail",
    "ai-agent",
    "model-context-protocol",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "jsonschema>=4.0.0",
]

[project.urls]
Homepage = "https://vivory.app"
Repository = "https://github.com/jayjodev/vivory-mcp"
Issues = "https://github.com/jayjodev/vivory-mcp/issues"
"Verification Gateway" = "https://api.vivory.app"

[project.scripts]
vivory-mcp-verification = "vivory_mcp_verification.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vivory_mcp_verification"]
