# Drop-in workflow file for the PUBLIC mirror repo (jayjodev/vivory-mcp).
#
# Operator steps (one time, if not already configured):
#   1. cp src/mcp-server-korea/.github-mirror/publish-korea.yml \
#        ~/path/to/jayjodev-vivory-mcp/.github/workflows/publish-korea.yml
#   2. On PyPI: https://pypi.org/manage/account/publishing/ → trusted publisher
#        Project name:       vivory-mcp-korea
#        Owner:              jayjodev
#        Repository name:    vivory-mcp
#        Workflow filename:  publish-korea.yml
#        Environment name:   pypi
#   3. Tag releases as `korea-v0.4.0` etc. and push.
#
# Difference from prior publish workflow: this version adds a pytest gate
# (schema + handler + envelope) that must pass before sdist/wheel build.

name: Publish vivory-mcp-korea to PyPI

on:
  push:
    tags:
      - 'korea-v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    name: Test → build → publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    defaults:
      run:
        working-directory: packages/mcp-server-korea

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package + dev extras
        run: pip install -e ".[dev]"

      - name: Pytest gate
        run: pytest -q tests/

      - name: Install build deps
        run: pip install --upgrade build

      - name: Build sdist + wheel
        run: python -m build

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/mcp-server-korea/dist/

      - name: Summary
        run: |
          echo "### vivory-mcp-korea published" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: ${GITHUB_REF#refs/tags/}" >> $GITHUB_STEP_SUMMARY
          echo "- PyPI: https://pypi.org/project/vivory-mcp-korea/" >> $GITHUB_STEP_SUMMARY
