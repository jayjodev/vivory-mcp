[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vivory-mcp-korea"
version = "0.2.0"
description = "Umbrella MCP server for Korean public data — KOSIS + BOK + KMA + AirKorea + Opinet + HIRA + NMC + MOLIT + KTO + MFDS + MOIS + NEIS + Seoul OpenData. 45 tools across 13 sources, single registration point for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Vivory", email = "contact@vivory.app" },
]
keywords = ["mcp", "korea", "kosis", "ecos", "neis", "anthropic", "claude", "public-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    # vivory-mcp-kosis re-exports its tool catalog. When PyPI publishes,
    # we'll switch to a strict version constraint. For now (pre-PyPI),
    # users install both packages from git via README instructions.
]

[project.urls]
Homepage = "https://vivory.app"
Repository = "https://github.com/jayjodev/vivory-mcp"
Issues = "https://github.com/jayjodev/vivory-mcp/issues"
"Korea Data Gateway" = "https://api.vivory.app"

[project.scripts]
vivory-mcp-korea = "vivory_mcp_korea.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vivory_mcp_korea"]
