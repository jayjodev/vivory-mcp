[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vivory-mcp-korea"
version = "0.6.1"
description = "DEPRECATED v0.6.1 — migrate: uvx vivory-mcp-verification. Korean raw-data wrappers retired (they redistributed data rather than verified it). Vivory's verifiable-AI-work mission uses Korean sources (법령정보센터·NTS·DART·KMA·KOSIS) as evidence for verdicts inside vivory-mcp-verification, not raw passthrough. Korean verdict tools already shipped: kor_law_currency, kor_company_status, doi_retraction_status. Same $29/mo Pro key. v0.6.1 = name re-claim (v0.6.0 burned by prior delete)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Vivory", email = "contact@vivory.app" },
]
keywords = ["mcp", "korea", "kosis", "ecos", "neis", "vworld", "spatial", "geocoding", "nts", "business-number", "anthropic", "claude", "public-data", "verifiable-ai", "korea-data-gateway", "model-context-protocol", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "jsonschema>=4.0.0",
]

[project.urls]
Homepage = "https://vivory.app"
Repository = "https://github.com/jayjodev/vivory-mcp"
Issues = "https://github.com/jayjodev/vivory-mcp/issues"
"Korea Data Gateway" = "https://api.vivory.app"

[project.scripts]
vivory-mcp-korea = "vivory_mcp_korea.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vivory_mcp_korea"]
