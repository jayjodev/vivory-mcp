[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vivory-mcp-korea"
version = "0.6.2"
description = "DEPRECATED v0.6.2 — migrate: uvx vivory-mcp-verification (Korean verdict tools included; Tools Pro $4.99/mo key, bundle absorb 2026-06-01)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Vivory", email = "contact@vivory.app" },
]
keywords = ["mcp", "korea", "anthropic", "claude", "deprecated", "verifiable-ai", "model-context-protocol", "ai-agent"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "jsonschema>=4.0.0",
]

[project.urls]
Homepage = "https://vivory.app"
Repository = "https://github.com/jayjodev/vivory-mcp"
Issues = "https://github.com/jayjodev/vivory-mcp/issues"
"Successor (vivory-mcp-verification)" = "https://pypi.org/project/vivory-mcp-verification/"

[project.scripts]
vivory-mcp-korea = "vivory_mcp_korea.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vivory_mcp_korea"]
