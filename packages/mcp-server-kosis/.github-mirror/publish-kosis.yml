# Drop-in workflow file for the PUBLIC mirror repo (jayjodev/vivory-mcp).
#
# vivory-mcp-kosis is DEPRECATED (EOL 2026-12-31). This workflow exists only
# to ship the final v0.1.2 maintenance release (Bearer key fwd-compat +
# kosis_table_explanation anyOf schema fix). No further versions will tag.
#
# Operator steps (one time):
#   1. cp src/mcp-server-kosis/.github-mirror/publish-kosis.yml \
#        ~/path/to/jayjodev-vivory-mcp/.github/workflows/publish-kosis.yml
#   2. Tag the final release: `kosis-v0.1.2` and push.
#   3. Add EOL notice on PyPI project page.

name: Publish vivory-mcp-kosis to PyPI (final maintenance release)

on:
  push:
    tags:
      - 'kosis-v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    name: Test → build → publish final maintenance release
    runs-on: ubuntu-latest
    environment: pypi
    defaults:
      run:
        working-directory: packages/mcp-server-kosis

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package + dev extras
        run: pip install -e ".[dev]"

      - name: Pytest gate
        run: pytest -q tests/

      - name: Install build deps
        run: pip install --upgrade build

      - name: Build sdist + wheel
        run: python -m build

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/mcp-server-kosis/dist/

      - name: Summary
        run: |
          echo "### vivory-mcp-kosis published (DEPRECATED, EOL 2026-12-31)" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: ${GITHUB_REF#refs/tags/}" >> $GITHUB_STEP_SUMMARY
          echo "- PyPI: https://pypi.org/project/vivory-mcp-kosis/" >> $GITHUB_STEP_SUMMARY
          echo "- Migration: pip install vivory-mcp-korea" >> $GITHUB_STEP_SUMMARY
