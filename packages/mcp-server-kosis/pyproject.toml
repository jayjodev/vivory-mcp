[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vivory-mcp-kosis"
version = "0.1.3"
description = "DEPRECATED (EOL 2026-12-31) — superseded by vivory-mcp-korea (umbrella, 56 tools across 16 sources). Install vivory-mcp-korea instead. v0.1.3 = squat-lock reclaim after v0.1.2 hard-delete (PyPI burns deleted version numbers, so the name was re-published at the next patch)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Vivory", email = "contact@vivory.app" },
]
keywords = ["mcp", "kosis", "korea", "statistics", "anthropic", "claude", "deprecated"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "jsonschema>=4.0.0",
]

[project.urls]
Homepage = "https://vivory.app"
Repository = "https://github.com/jayjodev/vivory-mcp"
Issues = "https://github.com/jayjodev/vivory-mcp/issues"
"Korea Data Gateway" = "https://api.vivory.app/kosis"

[project.scripts]
vivory-mcp-kosis = "vivory_mcp_kosis.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vivory_mcp_kosis"]
