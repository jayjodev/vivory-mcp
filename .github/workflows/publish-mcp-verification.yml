name: Publish vivory-mcp-verification to PyPI

# Triggered when a tag like `mcp-verification-v0.4.0` is pushed.
# Tag scheme: `mcp-verification-vX.Y.Z` (must match version in
# packages/mcp-server-verification/pyproject.toml).
#
# Setup (one-time, by repo owner):
#   1. Register on https://pypi.org and verify email.
#   2. https://pypi.org/manage/account/publishing/ → "Add a new pending publisher":
#        - PyPI Project Name: vivory-mcp-verification
#        - Owner:             jayjodev
#        - Repository name:   vivory-mcp
#        - Workflow filename: publish-mcp-verification.yml
#        - Environment name:  pypi
#   3. Settings → Environments → "pypi" (already exists if korea/kosis use it).
#   4. (Or, fallback) Add `PYPI_API_TOKEN` secret with a project-scoped token
#      and uncomment the `password:` line below.

on:
  push:
    tags:
      - 'mcp-verification-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (must match pyproject.toml, e.g. 0.4.0)'
        required: true
        type: string

jobs:
  build-and-publish:
    name: Build wheel and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vivory-mcp-verification
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build hatchling

      - name: Verify version matches tag
        if: github.event_name == 'push'
        working-directory: packages/mcp-server-verification
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#mcp-verification-v}"
          PROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag version $TAG_VERSION != pyproject.toml version $PROJECT_VERSION"
            exit 1
          fi
          echo "Version OK: $TAG_VERSION"

      - name: Build distribution
        working-directory: packages/mcp-server-verification
        run: python -m build

      - name: Upload to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/mcp-server-verification/dist/
          # password: ${{ secrets.PYPI_API_TOKEN }}  # uncomment if NOT using Trusted Publishing
          verbose: true

      - name: Summary
        run: |
          echo "### vivory-mcp-verification published 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: \`${GITHUB_REF_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "- PyPI: https://pypi.org/project/vivory-mcp-verification/" >> $GITHUB_STEP_SUMMARY
          echo "- Install: \`uvx vivory-mcp-verification\`" >> $GITHUB_STEP_SUMMARY
